name: Sevalla
kind: company
description: Sevalla is an application, database, and static-site hosting platform-as-a-service
  by Kinsta, built on Google Cloud Platform and Cloudflare. It lets teams deploy apps
  from Git or Docker, provision managed databases (PostgreSQL, MySQL, MariaDB, MongoDB,
  Redis, Valkey), host static sites on a global edge, and run S3-compatible object
  storage. The public REST API (base https://api.sevalla.com/v3, Bearer API token)
  exposes 200+ endpoints to manage the entire platform programmatically.
