description: >-
  FinOps view of Sevalla spend. Sevalla bills usage-based, pay-as-you-go rates:
  application and database hosting are metered by running pod size (compute
  hours), plus build minutes and outbound bandwidth; object storage is billed
  per GB stored with no ingress/egress fees; static-site hosting has a free
  tier with metered bandwidth and build minutes. A hibernation feature pauses
  idle pods to reduce cost. Usage is exposed programmatically via the
  /company/usage endpoint for cost visibility and allocation.
notes: >-
  Pod and unit rates are subject to change; verify against the Sevalla pricing
  and billing pages and the /company/usage API during reconciliation.
sources:
- https://sevalla.com/pricing/
- https://docs.sevalla.com/billing/application-hosting-pricing/
