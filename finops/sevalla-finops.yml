meters:
- name: application_pod_hours
  description: Compute hours consumed by running application pods, billed per pod size.
  unit: pod_hours
  aggregation: sum
  dimensions:
  - company
  - application
  - pod_size
  - cluster
- name: database_pod_hours
  description: Compute hours consumed by running managed-database pods, billed per resource tier.
  unit: pod_hours
  aggregation: sum
  dimensions:
  - company
  - database
  - resource_type
  - cluster
- name: database_disk_gb
  description: Provisioned database disk space, billed per 10 GB add-on per month.
  unit: gigabytes
  aggregation: max
  dimensions:
  - company
  - database
- name: build_minutes
  description: Build/compile time for application and static-site deployments, billed per minute.
  unit: minutes
  aggregation: sum
  dimensions:
  - company
  - application
- name: bandwidth_gb
  description: Outbound bandwidth from applications, billed per GB (static-site tier includes a free allowance).
  unit: gigabytes
  aggregation: sum
  dimensions:
  - company
  - resource
- name: object_storage_gb
  description: Object storage stored per GB per month; no ingress/egress fees.
  unit: gigabytes
  aggregation: max
  dimensions:
  - company
  - bucket
principles:
- name: Visibility
  description: Pull usage via the /company/usage API and the pricing calculator; inspect spend by pod size, database, and bucket.
- name: Allocation
  description: Organize resources into projects and scope API keys per team; map projects to internal cost centers.
- name: Optimization
  description: Enable hibernation to pause idle pods; right-size pod tiers; use the free static-site tier; keep object storage on R2 to avoid egress fees.
- name: Accountability
  description: Assign owners per project and API key; set usage alerts and review monthly spend against budget.
maintainers:
